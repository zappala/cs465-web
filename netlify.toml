# Netlify settings for cs465.zappala.org. Settings here override the ones in
# the Netlify dashboard (project symphonious-mooncake-68ffc6).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Keep in sync with .nvmrc
  NODE_VERSION = "22"

# Security headers for every page and file.
#
# The Content-Security-Policy allows only this site's own files: every page,
# image, font, script and stylesheet is served from cs465.zappala.org.
# 'unsafe-inline' is needed for Astro's inline island scripts (the menus) and
# for inline <style> tags. If a page ever embeds something from another site
# (a YouTube video, an image hosted elsewhere, a form), add that host here:
# frame-src for iframes, img-src for images, and so on. See the README.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

# Astro puts a content hash in every file name under /_astro/, so these files
# never change and browsers can keep them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
